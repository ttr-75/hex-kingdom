version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hex-kingdom-db
    environment:
      POSTGRES_DB: hex_kingdom
      POSTGRES_USER: hex_user
      POSTGRES_PASSWORD: hex_pass_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hex_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: hex-kingdom-mongo
    environment:
      MONGO_INITDB_DATABASE: hex-kingdom
    ports:
      - "27017:27017"
    volumes:
      - ./.docker-data/mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hex-kingdom-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default:
    name: hex-kingdom-network
